services:
  vimage:
    build: .
    container_name: vimage-service
    ports:
      - "${PORT:-7749}:${PORT:-7749}"
    env_file:
      - .env
    volumes:
      - ./data:/data  # 持久化SQLite数据库
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '7749') + '/healthz').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/vimage.db
