<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vimage 登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #1f2937;
      background:
        radial-gradient(circle at 18% 20%, rgba(72, 187, 120, 0.18), transparent 28%),
        radial-gradient(circle at 78% 18%, rgba(66, 153, 225, 0.18), transparent 32%),
        linear-gradient(135deg, #f8fafc 0%, #eef2ff 48%, #f7fee7 100%);
      display: grid;
      place-items: center;
      padding: 1.25rem;
    }

    .login-panel {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 12px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
      padding: 2rem;
    }

    .brand {
      margin-bottom: 1.75rem;
    }

    .brand h1 {
      font-size: 1.75rem;
      line-height: 1.2;
      color: #111827;
      margin-bottom: 0.45rem;
      letter-spacing: 0;
    }

    .brand p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .field {
      display: grid;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.88rem;
      font-weight: 650;
      color: #334155;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 0.85rem;
      font-size: 1rem;
      color: #111827;
      background: #fff;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem 0.85rem;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .error.is-visible {
      display: block;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .login-panel {
        padding: 1.5rem;
      }

      .brand h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main class="login-panel">
    <div class="brand">
      <h1>Vimage</h1>
      <p>登录后查看监控面板和请求日志。</p>
    </div>

    <div class="error" id="error">用户名或密码不正确</div>

    <form method="post" action="/login">
      <input type="hidden" name="redirect" id="redirect" value="/dashboard">

      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">登录</button>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');

    if (redirect && redirect.startsWith('/') && !redirect.startsWith('//')) {
      document.getElementById('redirect').value = redirect;
    }

    if (params.get('error') === '1') {
      document.getElementById('error').classList.add('is-visible');
    }
  </script>
</body>
</html>
